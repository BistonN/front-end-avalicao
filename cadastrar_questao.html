<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cadastrar Questão</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
</head>
<body class="login-body">
    <div class="login-container" style="max-width:1000px;padding:1.6rem;margin:30px auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h2>Cadastrar Questão</h2>
            <div>
                <button class="btn" onclick="window.location.href='index.html'">Voltar</button>
            </div>
        </div>

        <form id="admin-create-form">
            <div class="form-grid">
                <div class="input-group" style="grid-column:1 / -1;">
                    <label>Pergunta</label>
                    <textarea id="q-pergunta" placeholder="Texto da pergunta"></textarea>
                </div>

                <div class="options-block" style="grid-column:1 / -1;">
                    <div class="input-group">
                        <label>Opção A</label>
                        <input type="text" id="q-a" required>
                    </div>
                    <div class="input-group">
                        <label>Opção B</label>
                        <input type="text" id="q-b" required>
                    </div>
                    <div class="input-group">
                        <label>Opção C</label>
                        <input type="text" id="q-c" required>
                    </div>
                    <div class="input-group">
                        <label>Opção D</label>
                        <input type="text" id="q-d" required>
                    </div>
                    <div class="input-group">
                        <label>Opção E</label>
                        <input type="text" id="q-e" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Resposta Correta</label>
                    <select id="q-correta" required>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Área</label>
                    <select id="q-area" required>
                        <option value="">Carregando áreas...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Ano</label>
                    <input type="number" id="q-ano" min="1900" max="2100" required>
                </div>

                <div class="input-group" style="grid-column:1 / -1;">
                    <label>URL do anexo / imagem (opcional)</label>
                    <input type="url" id="q-url">
                </div>

                <div class="input-group" style="grid-column:1 / -1;">
                    <label>Explicação (opcional)</label>
                    <textarea id="q-explicacao"></textarea>
                </div>
            </div>

            <div class="card-footer admin-actions">
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Salvar / Enviar</button>
                    <button type="button" id="btn-save-local" class="btn btn-outline">Salvar local</button>
                    <button type="button" id="btn-download-json" class="btn btn-ghost">Baixar JSON</button>
                </div>
                <span id="admin-msg" style="margin-left:10px;color:var(--text-light);"></span>
            </div>
        </form>
    </div>

    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
    <script src="script.js"></script>

    <!-- Modal de pré-visualização / confirmação -->
    <div id="admin-preview-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Pré-visualizar Questão</h3>
                <button class="icon-btn" onclick="closeAdminPreview()"><span class="material-icons-round">close</span></button>
            </div>
            <div id="admin-preview-body" style="max-height:60vh; overflow:auto; margin-bottom:12px;"></div>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button id="admin-preview-cancel" class="btn btn-ghost">Cancelar</button>
                <button id="admin-preview-confirm" class="btn btn-primary">Confirmar e Salvar</button>
            </div>
        </div>
    </div>
</body>
</html>
