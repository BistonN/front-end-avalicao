<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Avaliação SENAI.">
    <meta name="theme-color" content="#005caa">

    <title>Login - Avaliação SENAI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body class="login-body unselectable">
    
    <div class="login-container fade-in">
        <button id="theme-toggle" class="icon-btn login-theme-btn" title="Alternar Tema">
            <span class="material-icons-round">dark_mode</span>
        </button>
        <button id="create-token-btn" class="icon-btn" title="Criar Token" style="right:56px; position:absolute; top:15px;" onclick="window.location.href='create-token.html'">
            <span class="material-icons-round">qr_code</span>
        </button>
        <button id="create-question-btn" class="icon-btn" title="Cadastrar Questões" style="right:96px; position:absolute; top:15px;" onclick="window.location.href='cadastrar_questao.html'">
            <span class="material-icons-round">post_add</span>
        </button>

        <div class="login-header">
            <img src="logo.png" alt="Logo SENAI" class="senai-logo-login">
            <h1>Ambiente de Avaliação</h1>
            <p>Selecione sua prova para iniciar</p>
            
        </div>

        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="student-name">Nome Completo</label>
                <div class="input-wrapper">
                    <span class="material-icons-round input-icon">person</span>
                    <input type="text" id="student-name" placeholder="Digite seu nome completo" required>
                </div>
            </div>

            <div class="input-group">
                <label for="student-email">Email</label>
                <div class="input-wrapper">
                    <span class="material-icons-round input-icon">email</span>
                    <input type="email" id="student-email" placeholder="Digite seu email" required>
                </div>
            </div>

            <div class="input-group">
                <label>Código da Prova</label>
                <div class="code-input-wrapper">
                    <input type="text" class="code-input" id="code-1" maxlength="1" placeholder="-" required>
                    <input type="text" class="code-input" id="code-2" maxlength="1" placeholder="-" required>
                    <input type="text" class="code-input" id="code-3" maxlength="1" placeholder="-" required>
                    <input type="text" class="code-input" id="code-4" maxlength="1" placeholder="-" required>
                    <input type="text" class="code-input" id="code-5" maxlength="1" placeholder="-" required>
                    <input type="text" class="code-input" id="code-6" maxlength="1" placeholder="-" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
                Iniciar Avaliação <span class="material-icons-round">arrow_forward</span>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
