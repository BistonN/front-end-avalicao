<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Criar Token - Avaliação SENAI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .create-token-container { max-width: 560px; margin: 40px auto; }
    .q-list { list-style:none; padding-left:0; margin-top:12px }
    .q-list li { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg-body); margin-bottom:8px }
    .small { font-size:0.9rem; color:var(--text-light) }
  </style>
</head>
<body class="login-body unselectable">
  <div class="login-container create-token-container fade-in">
    <div class="login-header">
      <img src="logo.png" alt="Logo SENAI" class="senai-logo-login">
      <h1>Criar Token de Prova</h1>
      <p class="small">Adicione os IDs das questões e clique em criar token.</p>
    </div>

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <input id="qInput" type="number" min="1" placeholder="Id da questão" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--border)" />
      <button id="addBtn" type="button" class="btn btn-outline">Adicionar</button>
    </div>

    <ul id="qList" class="q-list"></ul>

    <div style="display:flex;gap:8px;">
      <button id="createBtn" class="btn btn-primary btn-full">Criar token</button>
    </div>

    <div id="result" style="margin-top:12px"></div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';
    const qInput = document.getElementById('qInput');
    const addBtn = document.getElementById('addBtn');
    const qListEl = document.getElementById('qList');
    const createBtn = document.getElementById('createBtn');
    const resultEl = document.getElementById('result');
    const questions = [];

    function renderList(){
      qListEl.innerHTML = '';
      questions.forEach((q, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${q}</span>`;
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'btn btn-ghost'; btn.textContent = 'Remover';
        btn.onclick = () => { questions.splice(idx,1); renderList(); };
        li.appendChild(btn);
        qListEl.appendChild(li);
      });
    }

    addBtn.addEventListener('click', () => {
      const val = parseInt(qInput.value, 10);
      if (!val || val <= 0) return alert('Informe um id de questão válido');
      if (questions.includes(val)) return alert('Questão já adicionada');
      questions.push(val);
      qInput.value = '';
      renderList();
    });

    createBtn.addEventListener('click', async () => {
      if (questions.length === 0) return alert('Adicione pelo menos uma questão');
      resultEl.textContent = 'Enviando...';
      try {
        const resp = await fetch(`${API_URL}/form`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ questions })
        });
        const data = await resp.json();
        if (!resp.ok) { resultEl.innerHTML = '<strong>Erro:</strong> ' + (data.message || JSON.stringify(data)); return; }
        resultEl.innerHTML = `<strong>Token:</strong> ${data.subToken} <br><strong>Qtd questões:</strong> ${data.questionsCount}`;
        questions.length = 0; renderList();
      } catch (err) { resultEl.innerHTML = '<strong>Erro:</strong> ' + err.message; }
    });
  </script>
  <script>
    // Aplicar tema salvo
    try {
      if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    } catch (e) {}
  </script>
</body>
</html>
